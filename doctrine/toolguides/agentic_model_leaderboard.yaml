# Agentic Model Leaderboard — Toolguide
# Parseable reference for model specialization and cost-tier awareness.
# Source: work/reports/llm_model_leaderboard_research_2026-02-27.md
# Used by: Directive 042 (Model Discipline), tactic model-discipline-selection

metadata:
  source: "arena.ai leaderboard"
  source_url: "https://arena.ai/leaderboard"
  last_updated: "2026-02-27"
  intent: "Support model choice by task arena and cost tier; avoid undue cost and ineffective selection."
  stack_config_sources:
    - "src/framework/config/model_router.yaml"
    - "config/models.yaml"

arenas:
  - slug: text
    description: "General chat, reasoning, long-form"
  - slug: code
    description: "Code generation, review, refactoring"
  - slug: vision
    description: "Image understanding, multimodal"
  - slug: search
    description: "Search-augmented, grounding, RAG"
  - slug: text-to-image
    description: "Image generation from text"
  - slug: image-edit
    description: "Image editing"
  - slug: text-to-video
    description: "Video generation from text"
  - slug: image-to-video
    description: "Video from image"

