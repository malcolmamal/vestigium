# --- Authentication -----------------------------------------------------------
# Set SONAR_TOKEN in your shell before running sonar-scanner.

# --- Project Identity ---------------------------------------------------------
sonar.projectKey=vestigium
sonar.projectName=Vestigium
sonar.projectVersion=1.0

# --- Server -------------------------------------------------------------------
sonar.host.url=http://localhost:9000

# --- Sources ------------------------------------------------------------------
# Backend Java sources and Frontend Angular sources
sonar.sources=src/main/java,frontend/src

# Test files
sonar.tests=src/test/java,frontend/src
sonar.test.inclusions=**/*.spec.ts,**/*Test.java

# Exclusions
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/.history/**,\
  **/coverage/**,\
  **/frontend/src/api/**,\
  **/*.spec.ts,\
  **/*Test.java

# --- Language -----------------------------------------------------------------
sonar.typescript.tsconfigPath=frontend/tsconfig.json
sonar.java.binaries=build/classes/java/main

# --- Coverage -----------------------------------------------------------------
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.java.coveragePlugin=jacoco
sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml

# --- Encoding -----------------------------------------------------------------
sonar.sourceEncoding=UTF-8

# --- Suppressions -------------------------------------------------------------
sonar.issue.ignore.multicriteria=e2,e3,e4,e5,e6,e7,e8,e9,e10,e11,e12,e13,e14,e15,e16,e17,e20,e21,e22,e23,e24,e25,e26,e27,e28,e29,e30,e31,e32,e33,e34,e35,e36,e37,e38,e39,e40,e41,e42,e43,e44,e45,e46,e47,e48,e49,e50,e51,e52,e53,e54
# S1874 - Deprecated Character warning (false positive from lack of classpath)
sonar.issue.ignore.multicriteria.e2.ruleKey=java:S1874
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.java
# S2933 - Typescript readonly
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S2933
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.ts
# S1161 - Override equals (we don't need it for all entities)
sonar.issue.ignore.multicriteria.e4.ruleKey=java:S1161
sonar.issue.ignore.multicriteria.e4.resourceKey=**/*.java
# S5411 - Primitive boolean (we use Boolean for nullability)
sonar.issue.ignore.multicriteria.e5.ruleKey=java:S5411
sonar.issue.ignore.multicriteria.e5.resourceKey=**/*.java
# S1135 - TODO comments
sonar.issue.ignore.multicriteria.e6.ruleKey=java:S1135
sonar.issue.ignore.multicriteria.e6.resourceKey=**/*.java
